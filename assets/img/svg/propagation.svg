<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img" aria-label="Ionospheric skip propagation">
<defs><linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0c1220"/><stop offset="1" stop-color="#070707"/></linearGradient>
<radialGradient id="ion" cx="0.5" cy="0" r="1"><stop offset="0" stop-color="rgba(212,175,55,.28)"/><stop offset="1" stop-color="rgba(212,175,55,0)"/></radialGradient></defs>
<rect width="800" height="400" fill="url(#sky)"/>
<path d="M0 90 Q400 40 800 90" fill="none" stroke="#d4af37" stroke-width="1.5" stroke-dasharray="6 6" opacity="0.7"/>
<rect x="0" y="60" width="800" height="60" fill="url(#ion)"/>
<text x="16" y="52" fill="#d4af37" font-family="Inter,sans-serif" font-size="15" opacity="0.9">Ionosphere (F layer)</text>
<path d="M0 360 Q400 330 800 360" fill="none" stroke="#3a4152" stroke-width="2"/>
<text x="16" y="388" fill="#8b8b8b" font-family="Inter,sans-serif" font-size="14">Earth surface</text>
<!-- TX -->
<g transform="translate(90,330)"><line x1="0" y1="0" x2="0" y2="-34" stroke="#f0d472" stroke-width="3"/><circle cx="0" cy="-34" r="4" fill="#f0d472"/><text x="-6" y="22" fill="#f2f2f2" font-family="Inter,sans-serif" font-size="14">TX</text></g>
<!-- RX -->
<g transform="translate(700,352)"><line x1="0" y1="0" x2="0" y2="-34" stroke="#f0d472" stroke-width="3"/><circle cx="0" cy="-34" r="4" fill="#f0d472"/><text x="-6" y="22" fill="#f2f2f2" font-family="Inter,sans-serif" font-size="14">RX</text></g>
<!-- skip path -->
<path d="M90 296 L400 96 L700 318" fill="none" stroke="#d4af37" stroke-width="3"/>
<polygon points="255,196 245,190 249,203" fill="#d4af37"/>
<polygon points="545,196 555,203 551,190" fill="#d4af37"/>
<text x="360" y="150" fill="#f0d472" font-family="Inter,sans-serif" font-size="14">skip / hop</text>
</svg>
